name: Build audio suite
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned audio suite
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Legion-ALC287-AW88399
          path: .build/Legion-ALC287-AW88399-0.1.0.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Legion-ALC287-AW88399
          path: release
      - name: Publish firmware-free package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum release/*.zip > release/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE.md
